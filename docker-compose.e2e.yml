# Override SOLO para las pruebas end-to-end.
#
# Uso: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up
#
# Fija ASPNETCORE_ENVIRONMENT=Testing en el backend para que se registren los
# endpoints de prueba (por ejemplo POST /api/auth/test-login), que permiten a
# Playwright autenticarse sin depender del flujo real de login.
#
# NUNCA se usa para desarrollo real ni para producción: este archivo solo se
# aplica explícitamente encadenado al compose de desarrollo durante la suite E2E.
services:
  backend:
    # El compose de desarrollo ya declara en `environment` las variables que el
    # backend necesita (interpoladas desde .env), y solo esas entran al contenedor.
    # El stack E2E ademas inyecta el .env completo (valores desechables: JWT_SECRET,
    # GoogleOAuth__*, Database__ConnectionString contra el servicio `postgres`).
    # Es el unico punto donde se inyecta .env a un contenedor; `environment` tiene
    # prioridad sobre `env_file`, asi que lo declarado en el compose base no cambia.
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
