services:
  postgres:
    image: postgres:16-alpine
    container_name: mental-health-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mentalhealthtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mentalhealthtracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: mental-health-tracker-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/MentalHealthTracker.Api/bin
      - /app/MentalHealthTracker.Api/obj
      - /app/MentalHealthTracker.Domain/bin
      - /app/MentalHealthTracker.Domain/obj
      - /app/MentalHealthTracker.Infrastructure/bin
      - /app/MentalHealthTracker.Infrastructure/obj
      - /app/tests/MentalHealthTracker.UnitTests/bin
      - /app/tests/MentalHealthTracker.UnitTests/obj
      - /app/tests/MentalHealthTracker.IntegrationTests/bin
      - /app/tests/MentalHealthTracker.IntegrationTests/obj
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: mental-health-tracker-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres-data: