services:
  postgres:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36 # postgres:16-alpine
    container_name: mental-health-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mentalhealthtracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mentalhealthtracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: mental-health-tracker-backend
    restart: unless-stopped
    # Mayor que el ShutdownTimeout del host (10 s, HostingExtensions): con los 10 s por
    # defecto de Docker el SIGKILL llegaria justo cuando vence el apagado ordenado.
    stop_grace_period: 15s
    ports:
      - "3000:3000"
    # Solo entran al contenedor las variables declaradas aqui: el .env del
    # proyecto no se inyecta (ver docker-compose.e2e.yml). Compose lee .env para
    # interpolar; las claves obligatorias fallan con un mensaje claro si faltan.
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-mentalhealthtracker};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      AppUrls__FrontendUrl: http://localhost:5173
      GoogleOAuth__RedirectUri: http://localhost:5173/api/auth/google/callback
      LOG_LEVEL: ${LOG_LEVEL:-Information}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required: copy .env.example to .env and set it}"
      GoogleOAuth__ClientId: "${GoogleOAuth__ClientId:?GoogleOAuth__ClientId is required: set it in .env}"
      GoogleOAuth__ClientSecret: "${GoogleOAuth__ClientSecret:?GoogleOAuth__ClientSecret is required: set it in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/MentalHealthTracker.Api/bin
      - /app/MentalHealthTracker.Api/obj
      - /app/MentalHealthTracker.Domain/bin
      - /app/MentalHealthTracker.Domain/obj
      - /app/MentalHealthTracker.Infrastructure/bin
      - /app/MentalHealthTracker.Infrastructure/obj
      - /app/tests/MentalHealthTracker.UnitTests/bin
      - /app/tests/MentalHealthTracker.UnitTests/obj
      - /app/tests/MentalHealthTracker.IntegrationTests/bin
      - /app/tests/MentalHealthTracker.IntegrationTests/obj
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: mental-health-tracker-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # El navegador llama a /api y /hub en el mismo origen y el dev server
      # hace de proxy. Dentro de la red de Compose el backend se alcanza por
      # nombre de servicio, nunca por localhost.
      VITE_PROXY_TARGET: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres-data: