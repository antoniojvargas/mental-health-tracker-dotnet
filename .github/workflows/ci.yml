name: CI

on:
  pull_request:
  push:
    branches:
      - main

# El token del workflow solo lee el repositorio: ningún job escribe en él.
permissions:
  contents: read

# Un push nuevo a la misma PR cancela la ejecución anterior, que ya no sirve. En `main`
# no se cancela: cada merge conserva su ejecución completa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '22'

jobs:
  backend-test:
    name: Backend tests (.NET + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mht_test
          POSTGRES_PASSWORD: mht_test
          POSTGRES_DB: mht_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mht_test -d mht_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restore
        # --locked-mode: falla si packages.lock.json no coincide con los csproj, en vez de
        # resolver otras versiones en silencio.
        run: dotnet restore MentalHealthTracker.slnx --locked-mode

      - name: Build
        run: dotnet build MentalHealthTracker.slnx --no-restore --configuration Release

      - name: Tests unitarios con cobertura
        run: dotnet test tests/MentalHealthTracker.UnitTests/MentalHealthTracker.UnitTests.csproj --configuration Release -p:CoverletOutput=${{ github.workspace }}/coverage/unit/

      - name: Tests de integración con cobertura
        run: dotnet test tests/MentalHealthTracker.IntegrationTests/MentalHealthTracker.IntegrationTests.csproj --configuration Release -p:CoverletOutput=${{ github.workspace }}/coverage/int/

      - name: Umbral de cobertura
        working-directory: ${{ github.workspace }}
        run: ./scripts/check-coverage.sh 77.8

  frontend-test:
    name: Frontend tests (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Deriva de tipos: openapi.json (que OpenApiSnapshotTests verifica contra el
      # backend) es la fuente; si api.generated.d.ts no coincide con lo que se
      # genera de él, alguien editó uno sin regenerar el otro.
      - name: Comprobar que los tipos generados están al día
        run: |
          npm run generate:types
          git diff --exit-code src/types/api.generated.d.ts

      - name: Build
        run: npm run build

      - name: Tests con cobertura
        run: npm run test:unit:coverage

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: dotnet format
        working-directory: backend
        run: dotnet format MentalHealthTracker.slnx --verify-no-changes

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm install
        working-directory: frontend
        run: npm ci

      - name: npm lint
        working-directory: frontend
        run: npm run lint

      - name: npm format
        working-directory: frontend
        run: npm run format

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: NuGet audit
        working-directory: backend
        # Auditoría de vulnerabilidades de NuGet (activa por defecto en .NET 8+)
        # sobre toda la solución, incluyendo dependencias transitivas. Sale en
        # error si hay algún paquete vulnerable.
        # Estado: 0 paquetes vulnerables (verificado localmente, 2026-10-09).
        run: dotnet list MentalHealthTracker.slnx package --vulnerable --include-transitive

      - name: npm audit
        working-directory: frontend
        # Falla cuando existe vulnerabilidad de severidad >= high.
        #
        # Hallazgos aceptados conscientemente: ninguno en la firma actual.
        # Historial: source-map-js <=1.2.1 (GHSA-68fv-2mgg-jv7q, high, DoS del
        # event-loop via mapas de origen indexados) detectado el 2026-10-09. Se
        # valoró como riesgo bajo real: es transitiva del toolchain de build
        # (Vite/@vue/compiler-sfc/@tailwindcss), no llega al bundle de produccion
        # y el input que la explota (source maps hostiles) solo lo generan
        # nuestras herramientas de build de confianza. Igualmente se resolvio con
        # `npm audit fix` (bump en lockfile a 1.2.2), sin dependencias nuevas.
        #
        # Regla: si un hallazgo nuevo se decide aceptar a proposito, anotar aqui
        # el advisory, el motivo y la fecha de revision; de lo contrario este
        # paso quedara en rojo.
        run: npm audit --audit-level=high

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # .env desechable con valores ficticios: sin secretos reales. OAuth esta
      # puenteado en E2E, asi que GoogleOAuth__* solo cumplen la validacion de
      # config del backend y nunca se usan contra Google (las pruebas entran por
      # POST /api/auth/test-login). El override docker-compose.e2e.yml inyecta
      # este archivo al contenedor backend via env_file. Las claves con "__" son
      # el formato de separador que el configuration provider de .NET espera
      # (GoogleOAuth__ClientId -> GoogleOAuth:ClientId). Database__ConnectionString
      # apunta al servicio `postgres` de la red de Compose, no a localhost.
      - name: Crear .env desechable
        run: |
          cat > .env <<'EOF'
          Database__ConnectionString=Host=postgres;Port=5432;Database=mentalhealthtracker;Username=postgres;Password=postgres
          JWT_SECRET=e2e-only-disposable-secret-0123456789abcdef
          GoogleOAuth__ClientId=e2e-test-client.apps.googleusercontent.com
          GoogleOAuth__ClientSecret=e2e-disposable-client-secret
          GoogleOAuth__RedirectUri=http://localhost:5173/api/auth/google/callback
          AppUrls__FrontendUrl=http://localhost:5173
          LOG_LEVEL=Information
          EOF

      - name: Levantar la pila E2E
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 600

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Los navegadores pesan cientos de MB y solo cambian con la version de
      # @playwright/test, que se lee del lockfile. `install --with-deps` se ejecuta
      # siempre (las librerias del sistema no se cachean) pero no vuelve a descargar
      # el navegador si ya esta en la cache.
      - name: Version de Playwright
        id: playwright
        run: echo "version=$(node -p "require('./e2e/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache de navegadores de Playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Suite E2E completa
        working-directory: e2e
        run: npm test

      - name: Guardar logs del backend
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs backend > e2e-backend.logs.txt

      - name: Subir reporte E2E y logs del backend
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts
          path: |
            e2e/playwright-report/
            e2e-backend.logs.txt
          retention-days: 7

      - name: Bajar la pila E2E
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  prod-smoke:
    name: Prod smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Imagenes reales de produccion (nginx + bundle compilado) en el puerto 8080: la
      # suite `e2e` corre contra el servidor de Vite y no ejercita las cabeceras ni la
      # CSP de nginx. Secretos desechables generados al vuelo; el override fija
      # ASPNETCORE_ENVIRONMENT=Testing solo para exponer POST /api/auth/test-login.
      - name: Generar secretos desechables
        run: ./e2e/prod-secrets.sh

      # Las imagenes se construyen aqui con la cache de BuildKit que escribe el job
      # `build-prod-images` (mismos Dockerfile y contexto, mismo scope) y se cargan con
      # los nombres que espera docker-compose.prod.yml. Este job solo lee la cache.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Construir imagen del backend (cache de BuildKit)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          file: backend/Dockerfile.prod
          tags: mht-backend:prod
          load: true
          cache-from: type=gha,scope=backend-prod

      - name: Construir imagen del frontend (cache de BuildKit)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          tags: mht-frontend:prod
          load: true
          cache-from: type=gha,scope=frontend-prod

      # Sin --build: compose usa las imagenes ya cargadas en vez de reconstruirlas
      # (su builder no comparte la cache de BuildKit de arriba).
      - name: Levantar la pila de produccion
        run: |
          docker compose -p mht-prod-e2e --env-file e2e/prod-smoke.env \
            -f docker-compose.prod.yml -f docker-compose.prod.e2e.yml \
            up -d --wait --wait-timeout 600

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Los navegadores pesan cientos de MB y solo cambian con la version de
      # @playwright/test, que se lee del lockfile. `install --with-deps` se ejecuta
      # siempre (las librerias del sistema no se cachean) pero no vuelve a descargar
      # el navegador si ya esta en la cache.
      - name: Version de Playwright
        id: playwright
        run: echo "version=$(node -p "require('./e2e/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache de navegadores de Playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Recorrido critico contra la imagen de produccion
        working-directory: e2e
        run: npm run test:prod-smoke

      - name: Guardar logs de la pila
        if: failure()
        run: |
          docker compose -p mht-prod-e2e --env-file e2e/prod-smoke.env \
            -f docker-compose.prod.yml -f docker-compose.prod.e2e.yml \
            logs > prod-smoke.logs.txt

      - name: Subir reporte y logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prod-smoke-artifacts
          path: |
            e2e/playwright-report/
            prod-smoke.logs.txt
          retention-days: 7

      - name: Bajar la pila
        if: always()
        run: |
          docker compose -p mht-prod-e2e --env-file e2e/prod-smoke.env \
            -f docker-compose.prod.yml -f docker-compose.prod.e2e.yml \
            down -v

  dev-stack-smoke:
    name: Dev stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sigue el flujo del README (cp .env.example .env) y solo sustituye los
      # secretos vacios por valores desechables. Evita que el stack de desarrollo
      # vuelva a levantarse con un backend sin configuracion (hallazgo A1).
      - name: Crear .env desde .env.example
        run: |
          cp .env.example .env
          sed -i 's|^JWT_SECRET=.*|JWT_SECRET=smoke-only-disposable-secret-0123456789abcdef|' .env
          sed -i 's|^GoogleOAuth__ClientId=.*|GoogleOAuth__ClientId=smoke-test-client.apps.googleusercontent.com|' .env
          sed -i 's|^GoogleOAuth__ClientSecret=.*|GoogleOAuth__ClientSecret=smoke-disposable-client-secret|' .env

      - name: Levantar postgres y backend
        run: docker compose up -d --build --wait --wait-timeout 600 postgres backend

      - name: Comprobar /api/health
        run: |
          body=$(curl -fsS http://localhost:3000/api/health)
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'

      - name: Logs del backend
        if: failure()
        run: docker compose logs backend

      - name: Bajar la pila
        if: always()
        run: docker compose down -v

  build-prod-images:
    name: Build prod images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # `mode=max` guarda tambien las capas intermedias (restore, build) para que
      # `prod-smoke` y las ejecuciones siguientes las reutilicen. Solo este job escribe.
      - name: Build backend prod image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          file: backend/Dockerfile.prod
          tags: mht-backend:ci
          load: true
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,scope=backend-prod,mode=max

      - name: Build frontend prod image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          tags: mht-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,scope=frontend-prod,mode=max

      - name: Verificar usuario no root del backend
        run: |
          uid=$(docker run --rm --entrypoint id mht-backend:ci -u)
          echo "El proceso del backend corre con uid=$uid"
          [ "$uid" != "0" ] || { echo "El backend correria como root"; exit 1; }

      - name: Verificar retry de BD en vez de crash por dependencia
        run: |
          # Sin postgres a mano (Host=postgres no resuelve): el arranque debe
          # quedarse reintentando la conexion con backoff (DatabaseInitializer),
          # no morir por una dependencia faltante. Todas las opciones requeridas
          # se pasan para pasar la validacion de config y llegar al bucle de retry.
          docker run -d --name mht-be-retry \
            -e Database__ConnectionString="Host=postgres;Port=5432;Database=mentalhealthtracker;Username=postgres;Password=postgres" \
            -e JWT_SECRET="ci-only-disposable-secret-0123456789" \
            -e GoogleOAuth__ClientId="ci-test.apps.googleusercontent.com" \
            -e GoogleOAuth__ClientSecret="ci-disposable-secret" \
            -e GoogleOAuth__RedirectUri="http://localhost:5173/api/auth/google/callback" \
            -e AppUrls__FrontendUrl="http://localhost:5173" \
            mht-backend:ci
          sleep 15
          logs=$(docker logs mht-be-retry 2>&1)
          printf '%s\n' "$logs"
          echo "$logs" | grep -q "Database not ready (attempt" || {
            echo "No se ve el reintento de conexion a la BD"; exit 1
          }
          state=$(docker inspect -f '{{.State.Running}}' mht-be-retry)
          [ "$state" = "true" ] || {
            echo "El contenedor murio en lugar de reintentar la conexion"; exit 1
          }

      - name: Limpiar contenedor de verificacion
        if: always()
        run: docker rm -f mht-be-retry || true