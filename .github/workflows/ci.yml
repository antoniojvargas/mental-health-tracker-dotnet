name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MentalHealthTracker.slnx

      - name: Build
        run: dotnet build MentalHealthTracker.slnx --no-restore --configuration Release

      - name: Tests unitarios
        run: dotnet test tests/MentalHealthTracker.UnitTests/MentalHealthTracker.UnitTests.csproj --no-build --configuration Release

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests unitarios
        run: npm run test:unit

      - name: Build
        run: npm run build

  backend-test:
    name: Backend tests (.NET + Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mht_test
          POSTGRES_PASSWORD: mht_test
          POSTGRES_DB: mht_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mht_test -d mht_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MentalHealthTracker.slnx

      - name: Build
        run: dotnet build MentalHealthTracker.slnx --no-restore --configuration Release

      - name: Tests unitarios con cobertura
        run: dotnet test tests/MentalHealthTracker.UnitTests/MentalHealthTracker.UnitTests.csproj --configuration Release -p:CoverletOutput=${{ github.workspace }}/coverage/unit/

      - name: Tests de integración con cobertura
        run: dotnet test tests/MentalHealthTracker.IntegrationTests/MentalHealthTracker.IntegrationTests.csproj --configuration Release -p:CoverletOutput=${{ github.workspace }}/coverage/int/

      - name: Umbral de cobertura
        working-directory: ${{ github.workspace }}
        run: ./scripts/check-coverage.sh 70

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: dotnet format
        working-directory: backend
        run: dotnet format MentalHealthTracker.slnx --verify-no-changes

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm install
        working-directory: frontend
        run: npm ci

      - name: npm lint
        working-directory: frontend
        run: npm run lint

      - name: npm format
        working-directory: frontend
        run: npm run format