    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36 # postgres:16-alpine
    container_name: mental-health-tracker-postgres-test
    environment:
      POSTGRES_USER: mht_test
      POSTGRES_PASSWORD: mht_test
      POSTGRES_DB: mht_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data