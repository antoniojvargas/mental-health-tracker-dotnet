# Configuracion de produccion del frontend: sirve el bundle estatico de Vite
# (SPA con fallback a index.html) y proxifica /api y /hub al backend por el
# nombre de servicio de la red de Compose (http://backend:3000). El proxy de
# /hub activa el upgrade a WebSocket, que es como se comunica SignalR.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion gzip de las respuestas textuales (JS, CSS, JSON, SVG).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Los assets de Vite llevan el hash del contenido en el nombre, asi que una
    # URL determinada nunca cambia: se cachean de forma indefinida.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El index.html es el punto de entrada de la SPA y siempre debe revalidarse
    # para no servir un bundle obsoleto. Cubre tambien el fallback de la SPA.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hub {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
