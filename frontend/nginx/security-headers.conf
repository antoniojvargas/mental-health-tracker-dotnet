# Cabeceras de seguridad de los ficheros estaticos de la SPA.
#
# Se incluye (`include /etc/nginx/security-headers.conf;`) en cada location que
# sirve estaticos: /, /assets/ y = /index.html. NO se incluye en /api ni en /hub,
# porque esas respuestas vienen del backend, que ya pone las suyas
# (SecurityHeadersMiddleware); duplicarlas aqui las repetiria en la respuesta.
#
# Por que un fragmento y no un add_header a nivel server: en nginx, si un
# location declara cualquier add_header, deja de heredar TODOS los del nivel
# anterior. /assets/ e /index.html ya definen Cache-Control, asi que las
# cabeceras de seguridad tienen que repetirse dentro de cada location, y el
# include evita copiarlas a mano en tres sitios.
#
# `always` las manda tambien en 4xx/5xx (un 404 de /assets/ tambien debe
# llevarlas).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Content-Security-Policy (en vigor; antes en modo informe). Si algo la incumple, el
# navegador lo bloquea: e2e/fixtures/csp.ts hace fallar prod-smoke ante cualquier
# violacion, asi que una regresion se ve en el CI antes de llegar a produccion.
#   * fonts.googleapis.com / fonts.gstatic.com: hoja de estilos y ficheros de la tipografia.
#   * *.googleusercontent.com: avatares de Google (User.avatarUrl).
#   * connect-src 'self': cubre fetch y tambien el WebSocket de /hub en el mismo origen
#     (verificado en Chromium). Si algun navegador no lo cubriera, anadir ws:/wss: del
#     origen publico explicitamente.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
